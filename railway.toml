# Railway build/deploy config for the FastAPI backend.
# Drop this in the repo root; Railway picks it up automatically on deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand here — Railway runs `startCommand` directly without a shell,
# which means `cd` (a shell builtin) breaks. The Dockerfile's CMD already
# wraps the command in `sh -c` so it expands $PORT and runs `cd` correctly.
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
# Restart on crash but cap to avoid loops on a bad deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
