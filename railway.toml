# Railway build/deploy config for the FastAPI backend.
# Drop this in the repo root; Railway picks it up automatically on deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects PORT — the Dockerfile CMD respects it.
startCommand = "cd api && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
# Restart on crash but cap to avoid loops on a bad deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
